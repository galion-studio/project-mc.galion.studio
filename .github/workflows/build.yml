# Titan Server - CI/CD Pipeline
# Automated build and test on push

name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    

    - name: Check for Gradle wrapper
      id: gw
      run: |
        if [ -f gradlew ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No ./gradlew in this repo; skipping Java/Docker steps."
        fi

    - name: Set up JDK 17
      if: steps.gw.outputs.present == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      if: steps.gw.outputs.present == 'true'
      run: chmod +x gradlew
    
    - name: Build with Gradle
      if: steps.gw.outputs.present == 'true'
      run: ./gradlew build --no-daemon
    
    - name: Run tests
      if: steps.gw.outputs.present == 'true'
      run: ./gradlew test --no-daemon
    
    - name: Upload build artifacts
      if: steps.gw.outputs.present == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: titan-jars
        path: |
          **/build/libs/*.jar
          !**/build/libs/*-javadoc.jar
          !**/build/libs/*-sources.jar
    
    - name: Generate test report
      if: always() && steps.gw.outputs.present == 'true'
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: '**/build/test-results/test/TEST-*.xml'
        reporter: java-junit

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    

    - name: Check for Gradle wrapper
      id: gw
      run: |
        if [ -f gradlew ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No ./gradlew in this repo; skipping Java/Docker steps."
        fi

    - name: Set up Docker Buildx
      if: steps.gw.outputs.present == 'true'
      uses: docker/setup-buildx-action@v3
    
    - name: Build proxy image
      if: steps.gw.outputs.present == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.proxy
        push: false
        tags: titan-proxy:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build server image
      if: steps.gw.outputs.present == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.server
        push: false
        tags: titan-server:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    

    - name: Check for Gradle wrapper
      id: gw
      run: |
        if [ -f gradlew ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No ./gradlew in this repo; skipping Java/Docker steps."
        fi

    - name: Set up JDK 17
      if: steps.gw.outputs.present == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Run checkstyle
      if: steps.gw.outputs.present == 'true'
      run: ./gradlew checkstyleMain checkstyleTest --no-daemon
      continue-on-error: true

